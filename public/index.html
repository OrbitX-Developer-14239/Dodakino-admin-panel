  <meta charset="utf-8" />

  <!-- Qiymat src/styles/colors.css dagi --color-bg-primary bilan bir xil bo'lishi SHART -->
  <meta name="theme-color" content="#0b0d12" />

  <!--
    Tema JS bundle'dan OLDIN qo'llanadi — aks holda sahifa avval bir
    rejimda chizilib, keyin ikkinchisiga "sakrardi" (FOUC): panel
    qorong'i, birinchi kadr esa oq bo'lardi.

    QOIDA ThemeManager BILAN AYNAN BIR XIL bo'lishi shart (src/index.js
    saqlanmagan holatda "auto" beradi): saqlangan qiymat yo'q yoki
    "auto" bo'lsa — tizim rejimi; aks holda o'sha qiymat.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark =
          t === "dark" ||
          ((!t || t === "auto") && matchMedia("(prefers-color-scheme: dark)").matches);

        var root = document.documentElement;
        root.classList.add(dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0b0d12" : "#f3f4f8");
      } catch (e) { }
    })();
  </script>
